<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CivicTrack - Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="topbar"></div>

<div class="wrap">
  <div>
    <h1>All complaints</h1>
    <p class="sub">Assign each complaint to an officer, or change its status yourself.</p>
  </div>

  <!-- Ginti (frontend khud list se nikalta hai) -->
  <div class="stats">
    <div class="stat"><div class="label">Total</div><div class="value" id="sTotal">0</div></div>
    <div class="stat"><div class="label" style="color:#92400E">Pending</div><div class="value" id="sPending">0</div></div>
    <div class="stat"><div class="label" style="color:#1E40AF">In progress</div><div class="value" id="sProgress">0</div></div>
    <div class="stat"><div class="label" style="color:#166534">Resolved</div><div class="value" id="sResolved">0</div></div>
  </div>

  <p class="msg" id="msg"></p>

  <div class="columns">
    <div class="col-main">
      <!-- Table (backend: GET /complaints, PATCH .../status, PATCH .../assign) -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Complaint</th><th>Status</th><th>Assigned officer</th></tr>
          </thead>
          <tbody id="rows"><tr><td colspan="4">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- Naya officer banao (backend: POST /officers) -->
    <div class="col-side">
      <form class="card" id="officerForm">
        <h2>Add an officer</h2>
        <div class="field"><label for="oname">Full name</label>
          <input id="oname" type="text" required></div>
        <div class="field"><label for="oemail">Email</label>
          <input id="oemail" type="email" required></div>
        <div class="field"><label for="opass">Password (6+ characters)</label>
          <input id="opass" type="password" minlength="6" required></div>
        <p class="msg" id="officerMsg"></p>
        <button class="btn block" type="submit" id="officerBtn">Create officer</button>
        <div id="officerList" class="m" style="margin-top:12px;font-size:14px;color:var(--muted)"></div>
      </form>
    </div>
  </div>

</div>

<script src="js/api.js"></script>
<script>
  const STATUSES = ["Pending", "In Progress", "Resolved"];
  let officers = [];                                  // [{id, full_name, ...}]

  if (requireRole("admin")) {
    renderTopbar();
    init();
    document.getElementById("rows").addEventListener("click", onRowClick);
    document.getElementById("officerForm").addEventListener("submit", onCreateOfficer);
  }

  async function init() {
    await loadOfficers();       // pehle officers, taaki dropdown bhar sake
    await load();
  }

  async function loadOfficers() {
    try {
      officers = asList(await API.officers());
      document.getElementById("officerList").textContent =
        officers.length ? "Officers: " + officers.map(o => o.full_name).join(", ") : "No officers yet.";
    } catch (err) {
      showMsg(document.getElementById("msg"), err.message, "error");
    }
  }

    async function load() {
    const rows = document.getElementById("rows");
    try {
      const items = asList(await API.complaints());

      const count = (s) => items.filter(c => c.status === s).length;
      document.getElementById("sTotal").textContent = items.length;
      document.getElementById("sPending").textContent = count("Pending");
      document.getElementById("sProgress").textContent = count("In Progress");
      document.getElementById("sResolved").textContent = count("Resolved");

      rows.innerHTML = items.length
        ? items.map(c => `
            <tr data-id="${esc(c.id)}">
              <td style="font-weight:700;color:var(--muted)">#${esc(c.id)}</td>
              <td>
                <div class="t">${esc(c.title)}</div>
                <div class="m">${esc(c.category)} · ${esc(c.location)}</div>
                ${c.image_path ? `<a href="${photoUrl(c.image_path)}" target="_blank"><img class="thumb" src="${photoUrl(c.image_path)}" alt="Photo"></a>` : ""}
              </td>
              <td>
                <div class="save-cell">
                  <select data-status aria-label="New status">
                    ${STATUSES.map(s => `<option ${s === c.status ? "selected" : ""}>${s}</option>`).join("")}
                  </select>
                  <button class="btn small" data-save>Save</button>
                </div>
              </td>
              <td>
                <div class="save-cell">
                  <select data-officer aria-label="Officer">
                    <option value="">${c.assigned_to ? "Change officer..." : "Select officer..."}</option>
                    ${officers.map(o => `<option value="${esc(o.id)}" ${o.id === c.assigned_to ? "selected" : ""}>${esc(o.full_name)}</option>`).join("")}
                  </select>
                  <button class="btn small" data-assign>Assign</button>
                </div>
              </td>
            </tr>`).join("")
        : '<tr><td colspan="4">Abhi koi complaint nahi hai.</td></tr>';
    } catch (err) {
      showMsg(document.getElementById("msg"), err.message, "error");
      rows.innerHTML = "";
    }
  }

  async function onRowClick(e) {
    const btn = e.target.closest("[data-save], [data-assign]");
    if (!btn) return;
    const tr = btn.closest("tr");
    const id = tr.dataset.id;
    const msg = document.getElementById("msg");
    showMsg(msg, "");
    btn.disabled = true;
    try {
      if (btn.hasAttribute("data-save")) {
        const status = tr.querySelector("[data-status]").value;
        await API.updateStatus(id, status);
        showMsg(msg, `Complaint #${id} ka status "${status}" ho gaya.`, "ok");
      } else {
        const officerId = tr.querySelector("[data-officer]").value;
        if (!officerId) throw new Error("Pehle officer chuno.");
        await API.assign(id, officerId);
        showMsg(msg, `Complaint #${id} officer ko assign ho gayi.`, "ok");
      }
      load();
    } catch (err) {
      showMsg(msg, err.message, "error");
      btn.disabled = false;
    }
  }

  async function onCreateOfficer(e) {
    e.preventDefault();
    const msg = document.getElementById("officerMsg");
    const btn = document.getElementById("officerBtn");
    showMsg(msg, "");
    btn.disabled = true;
    try {
      await API.createOfficer(
        document.getElementById("oname").value,
        document.getElementById("oemail").value,
        document.getElementById("opass").value
      );
      e.target.reset();
      showMsg(msg, "Officer ban gaya. Ab wo apni email se login kar sakta hai.", "ok");
      await loadOfficers();
      load();                                         // dropdowns mein naya officer aa jaye
    } catch (err) {
      showMsg(msg, err.message, "error");
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
